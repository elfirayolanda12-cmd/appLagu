<!-- @format -->

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Karaoke Indonesia Raya</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1>🎤 Karaoke Indonesia Raya (1 Stanza)</h1>

    <div id="lyrics">
      <p id="lyric-line">Klik "Mulai Rekam" untuk mulai menyanyi!</p>
    </div>

    <audio
      id="backsound"
      src="{{ url_for('static', filename='indonesia_raya.mp3') }}"
    ></audio>
    <button id="recordBtn">🎙️ Mulai Rekam</button>

    <p id="status" style="margin-top: 20px; font-size: 1.2rem"></p>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <!-- Particles Background -->
<div id="particles-js"></div>

<!-- Floating Flags -->
<div class="flag-float">🇮🇩</div>
<div class="flag-float">🇮🇩</div>
<div class="flag-float">🇮🇩</div>
<div class="flag-float">🇮🇩</div>

<!-- Particles.js Library -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
  // Initialize Particles
  particlesJS('particles-js', {
    particles: {
      number: { value: 80, density: { enable: true, value_area: 800 } },
      color: { value: '#ffffff' },
      shape: { type: 'circle' },
      opacity: { value: 0.5, random: true },
      size: { value: 3, random: true },
      line_linked: {
        enable: true,
        distance: 150,
        color: '#ffffff',
        opacity: 0.4,
        width: 1
      },
      move: {
        enable: true,
        speed: 2,
        direction: 'none',
        random: true,
        out_mode: 'out'
      }
    },
    interactivity: {
      detect_on: 'canvas',
      events: {
        onhover: { enable: true, mode: 'repulse' },
        onclick: { enable: true, mode: 'push' }
      }
    },
    retina_detect: true
  });
</script>

<!-- Your other scripts -->
<script src="{{ url_for('static', filename='script_webaudio_enhanced.js') }}"></script>
</body>

  </body>
</html>
